name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain
        run: swift --version

      - name: Run unit tests
        run: swift test --scratch-path .build

      - name: Build SnipX.app and package DMG
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/build-dmg.sh "$VERSION"
          codesign --verify --deep --strict dist/SnipX.app
          ls -lh dist/

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipX-${{ env.VERSION }}-dmg
          path: |
            dist/SnipX-${{ env.VERSION }}.dmg
            dist/SnipX-${{ env.VERSION }}.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SnipX v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ### 安装说明（macOS 14.0+ · Apple Silicon）

            1. 下载下方的 **`SnipX-${{ env.VERSION }}.dmg`** 并双击挂载，将 **`SnipX.app`** 拖入 **`Applications`（应用程序）** 文件夹。
            2. 由于安装包采用本地 Ad-hoc 签名（未使用付费 Apple Developer ID 公证），首次打开若提示「未验证开发者」或「已损坏」，请在终端执行以下命令移除隔离属性后再打开：
               ```bash
               xattr -cr /Applications/SnipX.app
               ```
            3. 首次启动后，按引导在「系统设置 → 隐私与安全性 → 屏幕与系统音频录制」中勾选允许 **SnipX**。
          files: |
            dist/SnipX-${{ env.VERSION }}.dmg
            dist/SnipX-${{ env.VERSION }}.dmg.sha256
